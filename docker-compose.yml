services:
  postgres:
    image: postgres:18
    container_name: nyc311_postgres
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d

  metabase:
    image: metabase/metabase:v0.63.22
    container_name: nyc311_metabase
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres

volumes:
  pgdata:
  metabase_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nyc311
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyc311"]
      interval: 5s
      retries: 10

  dagster:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dagster_home:/app/dagster_home

volumes:
  pgdata:
  dagster_home: